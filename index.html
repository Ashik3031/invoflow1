<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Billing POS</title>
    <script>
      (function() {
        function patch(obj) {
          if (!obj) return;
          try {
            var currentFetch = obj.fetch;
            if (!currentFetch && typeof window !== 'undefined') {
              currentFetch = window.fetch;
            }
            if (!currentFetch) return;
            Object.defineProperty(obj, 'fetch', {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            console.warn('Failed to patch fetch on', obj, e);
          }
        }
        if (typeof Window !== 'undefined' && Window.prototype) {
          patch(Window.prototype);
        }
        if (typeof window !== 'undefined') {
          patch(window);
        }
        if (typeof globalThis !== 'undefined') {
          patch(globalThis);
        }
        if (typeof self !== 'undefined') {
          patch(self);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
